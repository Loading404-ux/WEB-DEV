<!DOCTYPE html> <!--It's  a declaration that the Document type is HTML(HTML5)-->


<html lang="en"> <!--Opening of HTML tag , this contains the whole website info . It's contains a lang syntax which declare's the website language. Helps in SEO-->


<head> <!--Opening of head tag -->

    <meta charset="UTF-8"> <!--Sets the character encoding to UTF-8. It's always used in modern website.-->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--It makes your website scale properlyon different devices, It adjust the width as per the laptop or moblie screen.   Sets initial zoom level to 100%-->


    <title>Blog - Update!!</title>
    <!--Sets the webpage title-->

</head> <!--Closing of head tag -->


<body>  <!--Opening of body tag -->

    <!--contains the visible webpage content-->

</body>  <!--Closing of body tag -->


</html> <!--Closing of html tag -->
