<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIG AND SMALL</title>
</head>
<body>
    
    <big>Hello World</big>

    <br>

    <small>Hello World</small>

    <br>
    OR
    <br>

    <big>Hello World</big>

    <hr>

    <small>Hello World</small>

<!-- In this code the tag <big> & <small> is been used. -->

    <!-- <br> is used to goto the next line -->

    <!-- <hr> is used to draw a horizontal line for the next content -->

    
</body>
</html>
